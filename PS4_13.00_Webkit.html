  <title> شـركة أورجينال أسيـوط -ش الجمهوريـة -بجوار فرع فودافون </title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  min-height: 100vh;
  background: #08090a;
  color: #e6e8ec;
  font: 15px/1.45 "Segoe UI", "Tahoma", system-ui, -apple-system, sans-serif;
  position: relative;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url('preview.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.92;
  z-index: 0;
  filter: brightness(0.55) contrast(1.10);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 25%, rgba(200, 210, 220, 0.12), transparent 45%),
    radial-gradient(circle at center, rgba(40, 45, 55, 0.10), rgba(0, 0, 0, 0.65));
  z-index: 0;
  pointer-events: none;
}

#wrap {
  padding: 28px;
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

#header {
  text-align: center;
  margin-bottom: 26px;
  padding: 30px 24px 28px;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-radius: 34px;
  border: 1px solid rgba(220, 225, 235, 0.25);
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 0 35px rgba(200, 210, 225, 0.08);
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

#header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c0c5d0, #ffffff, #c0c5d0, transparent);
  box-shadow: 0 0 10px #d8dcce, 0 0 25px #a0a8b8;
  opacity: 0.9;
}

#header h1 {
  font-size: 75px;
  line-height: 1.05;
  font-weight: 900;
  color: #f5f7fa;
  margin-bottom: 10px;
  letter-spacing: 1px;
  white-space: nowrap;
  text-shadow: 0 0 5px rgba(255, 255, 255, 1), 0 0 12px rgba(220, 225, 235, 1), 0 0 25px rgba(180, 190, 205, 1), 0 0 45px rgba(140, 150, 170, 0.95), 0 0 80px rgba(100, 110, 130, 0.75);
  animation: neonName 2.5s ease-in-out infinite alternate;
}

@keyframes neonName {
  from { text-shadow: 0 0 5px rgba(240, 245, 250, 0.90), 0 0 12px rgba(200, 210, 225, 0.90), 0 0 25px rgba(160, 170, 185, 0.80), 0 0 45px rgba(120, 130, 145, 0.65), 0 0 75px rgba(80, 90, 105, 0.40); }
  to { text-shadow: 0 0 8px rgba(255, 255, 255, 1), 0 0 18px rgba(230, 235, 245, 1), 0 0 35px rgba(190, 200, 215, 1), 0 0 60px rgba(150, 160, 180, 0.95), 0 0 100px rgba(110, 120, 140, 0.75); }
}

#header .english-name {
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: 32px;
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: 6px;
  color: #d0d5e0;
  margin-top: 8px;
  margin-bottom: 22px;
  text-transform: uppercase;
  text-shadow: 0 0 5px rgba(230, 235, 245, 0.95), 0 0 12px rgba(190, 200, 215, 0.90), 0 0 25px rgba(150, 160, 175, 0.80), 0 0 45px rgba(110, 120, 135, 0.60);
  animation: englishGlow 3s ease-in-out infinite alternate;
}

@keyframes englishGlow {
  from { opacity: 0.82; text-shadow: 0 0 5px rgba(210, 215, 225, 0.70), 0 0 14px rgba(170, 180, 195, 0.65), 0 0 30px rgba(120, 130, 145, 0.45); }
  to { opacity: 1; text-shadow: 0 0 8px rgba(255, 255, 255, 1), 0 0 18px rgba(210, 220, 235, 1), 0 0 35px rgba(170, 180, 195, 0.85), 0 0 60px rgba(130, 140, 155, 0.60); }
}

#header .sub {
  font-size: 27px;
  line-height: 1.25;
  color: #c8ceda;
  letter-spacing: 1.5px;
  font-weight: 700;
  margin-top: 4px;
  margin-bottom: 24px;
  text-shadow: 0 0 6px rgba(210, 215, 225, 0.85), 0 0 15px rgba(170, 180, 195, 0.75), 0 0 30px rgba(120, 130, 145, 0.55);
}

#header .sub span { color: #f0f2f6; font-weight: 800; }

.neon-line {
  width: 72%;
  height: 2px;
  margin: 0 auto 24px;
  background: linear-gradient(90deg, transparent, rgba(180, 190, 205, 0.3), #d0d5e0, rgba(180, 190, 205, 0.3), transparent);
  box-shadow: 0 0 8px rgba(200, 210, 225, 0.8), 0 0 20px rgba(140, 150, 170, 0.45);
}

#header .phone {
  display: inline-block;
  font-size: 26px;
  line-height: 1.3;
  font-weight: 900;
  color: #f0f3f8;
  direction: ltr;
  letter-spacing: 2px;
  padding: 10px 24px;
  border-radius: 18px;
  border: 1px solid rgba(200, 210, 225, 0.35);
  background: transparent;
  box-shadow: 0 0 12px rgba(190, 200, 215, 0.45), 0 0 30px rgba(130, 140, 160, 0.35);
  text-shadow: 0 0 5px rgba(240, 245, 255, 1), 0 0 12px rgba(200, 210, 225, 1), 0 0 25px rgba(160, 170, 190, 0.95), 0 0 45px rgba(120, 130, 150, 0.75);
  animation: neonPhone 2s ease-in-out infinite alternate;
}

@keyframes neonPhone {
  from { box-shadow: 0 0 8px rgba(180, 190, 205, 0.35), 0 0 20px rgba(120, 130, 145, 0.25); }
  to { box-shadow: 0 0 15px rgba(210, 220, 235, 0.60), 0 0 35px rgba(150, 160, 180, 0.45), 0 0 60px rgba(110, 120, 140, 0.20); }
}

#state {
  font-size: 22px;
  font-weight: 800;
  margin: 0 0 18px;
  padding: 14px 20px;
  background: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border-radius: 22px;
  border: 1px solid rgba(200, 210, 225, 0.20);
  text-shadow: 0 0 10px rgba(200, 210, 225, 0.55);
  text-align: center;
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.loading-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 4px;
}

.loader {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.12);
  border-top-color: #ffffff;
  border-right-color: #b0b8c8;
  box-shadow: 0 0 10px rgba(220, 225, 235, 0.80), 0 0 25px rgba(150, 160, 180, 0.50);
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loader.done {
  animation: none;
  border: 4px solid #7fd0a0;
  box-shadow: 0 0 10px rgba(80, 220, 150, 0.85), 0 0 25px rgba(50, 200, 130, 0.55);
}

.loader-dots {
  display: inline-flex;
  gap: 6px;
  margin-left: 8px;
  vertical-align: middle;
}

.loader-dots span {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d0d5e0;
  box-shadow: 0 0 8px rgba(220, 225, 235, 0.8);
  animation: dot-bounce 1.4s infinite ease-in-out both;
}

.loader-dots span:nth-child(1) { animation-delay: -0.32s; }
.loader-dots span:nth-child(2) { animation-delay: -0.16s; }
.loader-dots span:nth-child(3) { animation-delay: 0s; }

@keyframes dot-bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
  40% { transform: scale(1.25); opacity: 1; }
}

#out-container {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  left: -99999px;
  top: -99999px;
}

#out {
  white-space: pre-wrap;
  font: 12px/1.45 Consolas, "Courier New", monospace;
  background: rgba(17, 21, 27, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  padding: 14px 18px;
  max-height: 300px;
  overflow-y: auto;
  color: #c8ced8;
}

.ok { color: #7fd0a0; }
.bad { color: #f28b82; }
.warn { color: #fdd663; }

.footer {
  position: fixed;
  bottom: 14px;
  right: 22px;
  z-index: 2;
  font-size: 13px;
  color: rgba(210, 215, 225, 0.55);
  letter-spacing: 1px;
  font-weight: 500;
  text-shadow: 0 0 8px rgba(180, 190, 205, 0.45), 0 0 18px rgba(120, 130, 150, 0.30);
}

#state.done {
  color: #7fd0a0;
  border-color: rgba(100, 220, 160, 0.30);
  text-shadow: 0 0 8px rgba(80, 220, 150, 0.70), 0 0 20px rgba(50, 180, 120, 0.45);
}

#state.error {
  color: #f28b82;
  border-color: rgba(240, 100, 90, 0.30);
  text-shadow: 0 0 8px rgba(240, 100, 90, 0.60);
}

@media (max-width: 1000px) {
  #header h1 { font-size: 54px; }
  #header .english-name { font-size: 30px; letter-spacing: 4px; }
  #header .sub { font-size: 24px; }
  #header .phone { font-size: 22px; }
}

@media (max-width: 600px) {
  #wrap { padding: 12px 14px; }
  #header { padding: 20px 10px 22px; border-radius: 24px; }
  #header h1 { font-size: 40px; white-space: normal; line-height: 1.15; }
  #header .english-name { font-size: 23px; letter-spacing: 2px; margin-bottom: 18px; }
  #header .sub { font-size: 21px; line-height: 1.3; }
  #header .phone { font-size: 18px; letter-spacing: 1px; padding: 8px 12px; }
  #state { font-size: 18px; padding: 11px 10px; }
  .loader { width: 30px; height: 30px; border-width: 4px; }
  .loading-wrapper { gap: 10px; }
  .footer { font-size: 10px; right: 12px; bottom: 8px; }
  body::before { opacity: 0.92; }
}
</style>
</head>

<script>
  const loader = document.getElementById("loader");
  const hostState = document.getElementById("hostState");
  const stateText = document.getElementById("stateText");

  window.poopsDone = function () {
    if (typeof exploitTimer !== "undefined") clearTimeout(exploitTimer);
    if (loader) loader.classList.add("done");
    if (hostState) hostState.classList.add("done"); // تم التعديل هنا
    if (stateText) {
      stateText.innerHTML =
        "اكتملت العملية بنجاح<br>" +
        "<small>Done successfully...</small>";
    }
  };

  window.poopsError = function (msg) {
    if (typeof exploitTimer !== "undefined") clearTimeout(exploitTimer);
    if (loader) loader.classList.remove("done");
    if (hostState) hostState.classList.add("error"); // تم التعديل هنا
    if (stateText) {
      stateText.innerHTML =
        (msg ? msg : "حدث خطأ أثناء تشغيل الثغرة") + "<br>" +
        "<small>Exploit Execution Failed</small>";
    }
  };

  window.onerror = function(msg, url, lineNo) {
    var fileName = url ? url.substring(url.lastIndexOf('/') + 1) : "Script";
    if (typeof poopsError === "function") {
      poopsError("خطأ: " + msg + " (" + fileName + ":" + lineNo + ")");
    }
    return true;
  };
</script>
