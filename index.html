<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>شركة أورجينال لصيانة البلايستيشن - أسيوط</title>
    <style>
        body {
            background-color: #0f1115;
            color: #ffffff;
            font-family: Tahoma, Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: #1a1f29;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 {
            color: #34d399;
            font-size: 32px;
            margin-bottom: 20px;
        }
        p {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background: #2563eb;
            color: #fff;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
        }
        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>شركة أورجينال لصيانة البلايستيشن</h1>
        <p>أسيوط - ش الجمهورية بجوار فرع فودافون</p>
        <div id="msg" style="font-size: 24px; color: #fde047; margin-bottom: 25px; font-weight: bold;">جاري فحص النظام...</div>
        <a href="run_lapse.html" id="exploit-link" class="btn" style="display:none;">اضغط هنا للتشغيل</a>
    </div>

    <script>
        // فحص مبسط جداً وآمن لمتصفح البلايستيشن بدون أي أكواد معقدة تسبب أخطاء
        var ua = navigator.userAgent;
        var msgDiv = document.getElementById("msg");
        var linkBtn = document.getElementById("exploit-link");

        if (ua.indexOf("PlayStation 4") !== -1 || ua.indexOf("Mozilla/5.0") !== -1) {
            msgDiv.innerHTML = "النظام جاهز للتشغيل";
            msgDiv.style.color = "#a7f3d0";
            linkBtn.style.display = "inline-block";
        } else {
            msgDiv.innerHTML = "مرحباً بك في الاستضافة";
            msgDiv.style.color = "#ffffff";
            linkBtn.style.display = "inline-block";
        }
    </script>

</body>
</html>
